name: Importar desde Discogs
# Ejecuta tools/dc-import.mjs en GitHub (con acceso a la API de Discogs) y sube a la misma rama
# js/data/dc.js, tools/dc-report.md y las portadas de art/dc-*.jpg.
# Se lanza a mano (Actions → «Importar desde Discogs» → Run workflow) o al cambiar el catálogo en una rama que no sea main.
# Sin el secreto DISCOGS_TOKEN solo importa los registros fijados (dc: { release }) y los que enlaza MusicBrainz;
# con él, también busca el resto. Settings → Secrets and variables → Actions → New repository secret.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, master]
    paths: [js/data/catalog.js, tools/dc-import.mjs]
permissions:
  contents: write
concurrency:
  group: discogs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Importar
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          HARMONY_CONTACT: https://github.com/${{ github.repository }}
        run: node tools/dc-import.mjs
      - run: npm test
      - name: Subir el resultado
        run: |
          git add js/data/dc.js tools/dc-report.md art/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Importación de Discogs"
          git pull --rebase && git push
